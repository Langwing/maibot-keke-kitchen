# ============================================================
# 麦麦的厨房 - 配置文件
# 直接改等号右边的值，保存即可，插件会自动重载（不用重启机器人）
# 以 # 开头的行是注释（说明文字），不用管，也别删
# ============================================================

# 插件总开关：true 开 / false 关（关掉后麦麦就没有厨房了）
enabled = true

# 谁能用厨房：填 QQ 号，要用引号包住、多个用逗号隔开，例如：
#   whitelist = ["123456789", "987654321"]
# 保持空的 [] 时谁都用不了
whitelist = []

# 谁被禁止用厨房（优先级比上面的白名单高），格式同上
blacklist = []

# 虚拟买菜钱包开关：true = 记账（买菜扣钱、能查余额流水）
# 觉得记账太费 token 就改成 false，做饭买菜照常，只是不算钱
wallet_enabled = true

# 钱包初始余额（元）。只在第一次创建时生效，以后改这里没用；
# 想给ta加钱，直接在聊天里说"给你 100 块买菜钱"就行
wallet_initial_balance = 500.0

# 保留最近多少顿的做饭记录
max_meals_log = 50

# 保留最近多少条钱包流水
max_transactions = 100

# 防翻车开关：改成 true 并重载插件，厨房恢复成初始满库存
# （钱包余额和账单保留，不受影响）
# !! 用完记得改回 false，否则每次重载都会把库存清一次 !!
reset_inventory_on_next_load = false

# ---------- 下面这段是插件系统自己用的，不要动 ----------
[plugin]
config_version = "1.0.0"
